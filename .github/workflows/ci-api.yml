name: API CI

on:
  push:
    branches: ['**']
    paths:
      - 'apps/api/**'
      - 'global.json'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'global.json'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore apps/api/Accounting.slnx
      - name: Build (warnings are errors)
        run: dotnet build apps/api/Accounting.slnx --no-restore -warnaserror
      - name: Test (Testcontainers uses runner Docker)
        run: dotnet test apps/api/Accounting.Api.Tests --no-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test workflow contracts
        run: |
          python -m pip install -r .github/tests/requirements.txt
          python -m unittest discover -s .github/tests -v
