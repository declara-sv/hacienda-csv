name: API CI

on:
  push:
    branches: ['**']
    paths:
      - 'apps/api/**'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accounting_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # --locked also fails when pyproject.toml changed without `uv lock`.
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked
      - name: Lint
        working-directory: apps/api
        run: uv run ruff check .
      - name: Test (Postgres service container)
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting_test
        run: uv run pytest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test workflow contracts
        run: |
          python -m pip install -r .github/tests/requirements.txt
          python -m unittest discover -s .github/tests -v
